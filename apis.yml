name: Approxima
description: >-
  Approxima is a Y Combinator (Winter 2026) startup building AI agents that test
  every pull request. Approxima plugs into your CI/CD pipeline and runs autonomous
  agents on each PR: the agents build your application in an isolated sandbox,
  exercise it in a real browser, and report exactly what is broken, with
  screenshots. The company positions itself as a trust layer for AI-assisted
  software development, letting engineering teams catch regressions and validate
  fixes end to end before code merges to production. As of this profile Approxima
  operates a marketing site and private login at approxima.ai and does not yet
  publish a public API, developer documentation, or an OpenAPI definition; this
  repo captures its identity and domain-security posture pending a public API surface.
